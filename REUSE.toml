version = 1
SPDX-PackageName = "kanri"
SPDX-PackageSupplier = "trobonox <hello@trobo.dev>"
SPDX-PackageDownloadLocation = "https://github.com/kanriapp/kanri"
# Generated by `pnpm exec tauri icon` for mobile targets; the desktop build only
# consumes the sidecar-licensed icons, so cover the extra outputs here.
[[annotations]]
paths = [
  "src-tauri/icons/64x64.png",
  "src-tauri/icons/ios/**",
  "src-tauri/icons/android/**",
]
SPDX-FileCopyrightText = "Copyright (c) 2022-2026 trobonox <hello@trobo.dev>"
SPDX-License-Identifier = "GPL-3.0-or-later"
